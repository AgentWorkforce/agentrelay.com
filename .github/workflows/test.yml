name: CI

# The deploy/preview workflows only prove the app *builds*. This one proves it
# still *works*: it runs the vitest suites and the TypeScript typechecks, which
# nothing in CI did before. Keep it dependency-free (no secrets, no third-party
# actions) so it also runs on fork PRs, where preview.yml intentionally skips.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Root script fans out to every workspace (web + router), so a new
      # workspace is covered automatically.
      - name: Run tests
        run: npm test

      # tsc reads web/tsconfig.json, which also globs .next/types/**. Those
      # files don't exist without a build; the glob simply matches nothing, so
      # this deliberately runs without a build to keep the job fast.
      - name: Typecheck web
        working-directory: web
        run: npx tsc --noEmit

      - name: Typecheck router
        working-directory: router
        run: npx tsc --noEmit
