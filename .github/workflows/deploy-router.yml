name: Deploy Router (Cloudflare)

on:
  push:
    branches:
      - main
    paths:
      - router/**
      - .github/workflows/deploy-router.yml
  workflow_dispatch:

concurrency:
  group: deploy-router-production
  cancel-in-progress: false

permissions:
  contents: read
  # Read the web deploy's run for this commit (see "Wait for the web deploy").
  actions: read

jobs:
  deploy-router:
    name: Deploy router
    runs-on: ubuntu-latest
    steps:
      # The router rewrites public paths onto web pages (arelay.to/<handle> ->
      # /u/<handle>), so a router that ships before the web deploy of the same
      # commit routes to pages that don't exist yet. That took
      # arelay.to/agent-relay down for ~10 minutes when #150 merged. Wait until
      # a successful web deploy includes this commit: its own, or a later one
      # (a newer push supersedes a queued web deploy in its concurrency group,
      # and the later deploy contains this commit's pages too). Refuse to ship
      # if this commit's own web deploy failed.
      - name: Wait for a web deploy that includes this commit
        id: wait
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 240); do
            own=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "missing" else "\(.status) \(.conclusion // "")" end' \
              || echo "lookup-failed")
            echo "web deploy for ${GITHUB_SHA::9}: ${own}"
            case "$own" in
              "completed success") echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"; exit 0 ;;
              "completed failure"|"completed timed_out"|"completed startup_failure")
                echo "::error::Deploy Web (Cloudflare) failed for this commit; not deploying the router."; exit 1 ;;
              lookup-failed) sleep 30; continue ;;
            esac
            # Own deploy is missing, queued, running or cancelled (superseded):
            # accept the newest successful web deploy if it contains this commit,
            # and deploy the router at THAT revision so router and pages match.
            latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' || echo "")
            if [ -n "$latest" ]; then
              rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${latest}" --jq '.status' || echo "")
              echo "latest successful web deploy ${latest::9} is ${rel:-unknown} relative to this commit"
              case "$rel" in ahead|identical) echo "sha=${latest}" >> "$GITHUB_OUTPUT"; exit 0 ;; esac
            fi
            sleep 30
          done
          echo "::error::Timed out after 2 hours waiting for a web deploy that includes this commit. Re-run this workflow once one succeeds."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The revision whose web deploy succeeded (this commit, or a later one
          # that contains it), so the router never ships ahead of or behind it.
          ref: ${{ steps.wait.outputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Worker secrets ship atomically with the deploy. Only secrets that are
      # present are written; an absent ANALYTICS_VISITOR_HASH_SECRET leaves
      # guide-fetch analytics failing closed (no data points).
      - name: Prepare optional Worker secrets
        shell: bash
        env:
          ANALYTICS_VISITOR_HASH_SECRET: ${{ secrets.ANALYTICS_VISITOR_HASH_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          export ROUTER_SECRETS_FILE="$RUNNER_TEMP/router-secrets.json"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const names = ["ANALYTICS_VISITOR_HASH_SECRET"];
          const secrets = Object.fromEntries(names.flatMap((name) => {
            const value = process.env[name];
            return value ? [[name, value]] : [];
          }));
          writeFileSync(process.env.ROUTER_SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });
          NODE

      - name: Deploy router to Cloudflare
        working-directory: router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../node_modules/.bin/wrangler deploy --secrets-file "$RUNNER_TEMP/router-secrets.json"

      - name: Remove temporary Worker secrets file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/router-secrets.json"
