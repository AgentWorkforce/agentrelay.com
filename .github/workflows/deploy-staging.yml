name: Deploy Staging (Cloudflare)

# Staging for public-staging.agentrelay.com: the agentrelay-web-staging Worker
# (origin-web-staging.agentrelay.com) and the agentrelay-router-staging Worker
# in front of it, from the `env.staging` blocks in web/ and router/
# wrangler.jsonc. Manual only: merging to main never deploys staging. The
# `staging` GitHub environment can add required reviewers on top.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify recommended-flow release pins
        run: npm run verify:recommended-flows

      # Staging build. PostHog stays off unless the staging environment sets
      # its own key, so staging traffic never lands in production analytics.
      - name: Build OpenNext (Cloudflare)
        working-directory: web
        env:
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_HOST || 'https://i.agentrelay.com' }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
        run: npm run cf:build

      # Same as production: serve prerendered pages from the assets bundle.
      - name: Populate static-assets cache
        working-directory: web
        run: npx opennextjs-cloudflare populateCache remote

      # Web first: the router rewrites paths onto web pages, so it must not
      # ship ahead of them (see deploy-router.yml).
      - name: Deploy web to Cloudflare (staging)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      # No Worker secrets: staging has no analytics binding, and the OpenAI
      # apps challenge is answered on agentrelay.com only.
      - name: Deploy router to Cloudflare (staging)
        working-directory: router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../node_modules/.bin/wrangler deploy --env staging
